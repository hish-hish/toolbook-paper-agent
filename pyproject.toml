[project]
name = "toolbook-paper-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ebooklib>=0.21",
    "lxml>=6.1.3",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
