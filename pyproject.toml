[project]
name = "toolbook-paper-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "ebooklib>=0.21",
    "jieba>=0.42.1",
    "langgraph>=1.2.22",
    "lxml>=6.1.3",
    "mineru[core]>=4.2.3",
    "openai>=2.54.0",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
